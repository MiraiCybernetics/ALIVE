  mentioned: true
  person:
    key: sim:zhaochen
    name: 赵辰
    closeness: 0.46
    baseline:
      n: 6
      them: 我就直说了啊，别嫌我嘴快。
      me: 我说下我的看法，你们也接着聊。
  history:
  - - 1.2
