# Held-out evaluation set (docs/11 §7). Written BEFORE any run; never copied into prompts, schemas or personas.
# A test (tests/eval/test_no_leak.py) fails if any message text here appears in those files.
# If a change is made because one of these items failed, that item is burned: move it to `retired` and write a new one.
#
# history entries: [hours_ago, who (me|them), text]; "baseline" adds N earlier everyday exchanges in the person's style.

