# Held-out set v2 (docs/21): own stance, topic initiative, empathy limits. Written BEFORE any run.
# Same rules as v1: never copied into prompts/schemas/personas; items that motivate a change are retired.
# my_day: real outcomes recorded for the individual before the turn (its actual day, set up by the harness).
# my_interests: topics the life texture currently holds (state setup, not prompt text).

set_version: 2.2
