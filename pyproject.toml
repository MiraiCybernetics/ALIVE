[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alive"
version = "0.1.0"
description = "ALIVE: a framework for persistent, autonomous, human-like digital individuals living in instant messaging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
embed = ["fastembed>=0.3"]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
alive = "alive.__main__:main"

[tool.setuptools.packages.find]
include = ["alive*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not live'"
markers = [
  "live: tests that call the real LLM API (deselect with -m 'not live')",
]
